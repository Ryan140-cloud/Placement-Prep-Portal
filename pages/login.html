<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Placement Prep Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body data-page="login">

  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Loading Placement Prep Portal...</p>
  </div>

  <header class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark">PP</span>
        Placement Prep Portal
      </a>
      <nav>
        <ul class="nav-links" id="nav-links">
          <li><a href="../index.html" data-page="home">Home</a></li>
          <li><a href="resources.html" data-page="resources">Resources</a></li>
          <li><a href="jobs.html" data-page="jobs">Jobs</a></li>
          <li><a href="about.html" data-page="about">About Us</a></li>
          <li><a href="contact.html" data-page="contact">Contact Us</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <a href="dashboard.html" class="nav-btn nav-btn-outline member-only">Dashboard</a>
        <a href="#" class="nav-btn nav-btn-solid logout-btn member-only">Logout</a>
        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-head">
          <h1>Welcome Back</h1>
          <p>Sign in to continue your placement preparation.</p>
        </div>

        <p class="auth-alert" id="login-alert"></p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" name="loginEmail" />
            <p class="error-msg" id="loginEmail-error"></p>
          </div>

          <div class="form-group password-field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="loginPassword" />
            <button type="button" class="toggle-password" data-target="loginPassword">Show</button>
            <p class="error-msg" id="loginPassword-error"></p>
          </div>

          <div class="form-group">
            <label for="loginCaptchaInput">Enter CAPTCHA</label>
            <div class="captcha-box">
              <span class="captcha-display" id="login-captcha"></span>
              <button type="button" class="captcha-refresh" id="login-captcha-refresh" aria-label="Refresh CAPTCHA" title="Refresh CAPTCHA">⟳</button>
            </div>
            <input type="text" id="loginCaptchaInput" name="loginCaptchaInput" placeholder="Type the code above" />
            <p class="error-msg" id="loginCaptchaInput-error"></p>
          </div>

          <label class="checkbox-row" style="margin-bottom:24px;">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            Remember Me
          </label>

          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p class="auth-footer-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </section>
  </main>

  <script src="../js/theme.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
