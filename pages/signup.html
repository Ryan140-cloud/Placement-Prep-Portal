<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Placement Prep Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body data-page="signup">

  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Loading Placement Prep Portal...</p>
  </div>

  <header class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark">PP</span>
        Placement Prep Portal
      </a>
      <nav>
        <ul class="nav-links" id="nav-links">
          <li><a href="../index.html" data-page="home">Home</a></li>
          <li><a href="resources.html" data-page="resources">Resources</a></li>
          <li><a href="jobs.html" data-page="jobs">Jobs</a></li>
          <li><a href="about.html" data-page="about">About Us</a></li>
          <li><a href="contact.html" data-page="contact">Contact Us</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <a href="dashboard.html" class="nav-btn nav-btn-outline member-only">Dashboard</a>
        <a href="#" class="nav-btn nav-btn-solid logout-btn member-only">Logout</a>
        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-card wide">
        <div class="auth-head">
          <h1>Create Your Account</h1>
          <p>Join Placement Prep Portal and start preparing today.</p>
        </div>

        <p class="auth-alert" id="signup-alert"></p>

        <form id="signup-form" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" />
            <p class="error-msg" id="fullName-error"></p>
          </div>

          <div class="auth-two-col">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" />
              <p class="error-msg" id="email-error"></p>
            </div>
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" placeholder="10-digit number" />
              <p class="error-msg" id="phone-error"></p>
            </div>
          </div>

          <div class="auth-two-col">
            <div class="form-group password-field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" />
              <button type="button" class="toggle-password" data-target="password">Show</button>
              <p class="error-msg" id="password-error"></p>
            </div>
            <div class="form-group password-field">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" />
              <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
              <p class="error-msg" id="confirmPassword-error"></p>
            </div>
          </div>

          <div class="form-group">
            <label for="college">College</label>
            <input type="text" id="college" name="college" />
            <p class="error-msg" id="college-error"></p>
          </div>

          <div class="auth-two-col">
            <div class="form-group">
              <label for="course">Course</label>
              <input type="text" id="course" name="course" placeholder="e.g. B.Tech CSE" />
              <p class="error-msg" id="course-error"></p>
            </div>
            <div class="form-group">
              <label for="gradYear">Graduation Year</label>
              <select id="gradYear" name="gradYear">
                <option value="">Select year</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
              </select>
              <p class="error-msg" id="gradYear-error"></p>
            </div>
          </div>

          <div class="form-group">
            <label for="captchaInput">Enter CAPTCHA</label>
            <div class="captcha-box">
              <span class="captcha-display" id="signup-captcha"></span>
              <button type="button" class="captcha-refresh" id="signup-captcha-refresh" aria-label="Refresh CAPTCHA" title="Refresh CAPTCHA">⟳</button>
            </div>
            <input type="text" id="captchaInput" name="captchaInput" placeholder="Type the code above" />
            <p class="error-msg" id="captchaInput-error"></p>
          </div>

          <label class="checkbox-row" style="margin-bottom:24px;">
            <input type="checkbox" id="terms" name="terms" />
            I agree to the Terms &amp; Conditions and Privacy Policy.
          </label>

          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <p class="auth-footer-link">Already have an account? <a href="login.html">Sign In</a></p>
      </div>
    </section>
  </main>

  <script src="../js/theme.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
